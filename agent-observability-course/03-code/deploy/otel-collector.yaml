# OpenTelemetry Collector: the traffic cop between Atlas and its backends (Section 13.2).
#
# receivers  -> memory_limiter -> attributes (redaction) -> tail_sampling -> batch -> exporters
#
# Redaction happens HERE as defence in depth: even if an app forgets to mask, the
# collector deletes tool results and message bodies and hashes user ids before anything
# leaves the network (Section 10.2).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # 1. Drop or hash sensitive span attributes.
  attributes/redact:
    actions:
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: langfuse.observation.input
        action: delete
      - key: langfuse.observation.output
        action: delete
      - key: gen_ai.tool.call.arguments
        action: hash            # keep a stable fingerprint so identical calls can still be grouped
      - key: user.id
        action: hash            # joinable pseudonym, never the employee id
      - key: enduser.id
        action: hash

  # 2. Keep every interesting trace, sample the rest (decision at trace end).
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 4000 }
      - name: expensive
        type: numeric_attribute
        numeric_attribute: { key: atlas.cost_usd, min_value: 0.05, max_value: 1000000 }
      - name: many-steps
        type: numeric_attribute
        numeric_attribute: { key: atlas.steps, min_value: 5, max_value: 100 }
      - name: escalated
        type: boolean_attribute
        boolean_attribute: { key: atlas.escalated, value: true }
      - name: baseline
        type: probabilistic
        probabilistic: { sampling_percentage: 20 }

  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  # Langfuse accepts OTLP/HTTP with basic auth (base64 of "public_key:secret_key").
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_BASE_URL}/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"
    timeout: 5s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 2000

  # Arize Phoenix (Section 12.3): `phoenix serve` listens on 6006.
  otlphttp/phoenix:
    endpoint: http://host.docker.internal:6006/v1/traces
    timeout: 5s

  # Collector's own view of the spans for debugging (`docker compose logs otel-collector`).
  debug:
    verbosity: basic

  # Span-derived metrics are exposed to Prometheus alongside the app's /metrics.
  prometheus:
    endpoint: 0.0.0.0:8889

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 4s, 8s, 16s]
    dimensions:
      - name: gen_ai.request.model
      - name: atlas.tenant
      - name: gen_ai.operation.name

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, tail_sampling, batch]
      exporters: [otlphttp/langfuse, debug, spanmetrics]
      # add otlphttp/phoenix here to fan out to Phoenix as well
    metrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
