# OpenTelemetry Collector: the traffic cop between Atlas and its backends (Section 13.2).
#
# receivers  -> memory_limiter -> attributes/redact -> tail_sampling -> batch -> exporters
#
# Processor names (exactly as below): memory_limiter, attributes/redact, tail_sampling, batch.
# Exporters in the traces pipeline: otlphttp/langfuse, otlphttp/phoenix, debug (+ the
# spanmetrics connector). Every sampled span goes to Langfuse AND Phoenix (Lecture 13.2).
#
# Redaction happens HERE as defence in depth: even if an app forgets to mask, the
# collector deletes tool results, message bodies and user ids before anything leaves the
# network (Section 10.2).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  # 1. Drop or hash sensitive span attributes.
  #
  # LIMITATION: the attributes processor's `hash` action is a plain, UNKEYED SHA-256 (no salt,
  # no secret; contrib 0.116.1 has no keyed/HMAC option here). A hash of a low-entropy value
  # such as a five-digit employee ID (NW-12345) is reversible by hashing all 100,000 candidates,
  # so it is not a pseudonym. Identifiers are therefore DELETED here. If a backend needs a
  # joinable user key, the app should emit a keyed HMAC pseudonym itself
  # (northwind.pii.stable_hash, keyed with ATLAS_PII_HASH_KEY), never the raw id.
  # `hash` is kept only for gen_ai.tool.call.arguments, which Atlas has already masked at the
  # source (identifiers inside are <EMPLOYEE_ID:hmac> placeholders), so the digest just groups
  # identical calls and exposes nothing new.
  attributes/redact:
    actions:
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: langfuse.observation.input
        action: delete
      - key: langfuse.observation.output
        action: delete
      - key: gen_ai.tool.call.arguments
        action: hash            # fingerprint of already-masked arguments: groups identical calls
      - key: user.id
        action: delete          # raw employee id; an unkeyed hash of it is reversible
      - key: enduser.id
        action: delete

  # 2. Keep every interesting trace, sample the rest (decision at trace end).
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 4000 }
      - name: expensive
        type: numeric_attribute
        numeric_attribute: { key: atlas.cost_usd, min_value: 0.05, max_value: 1000000 }
      - name: many-steps
        type: numeric_attribute
        numeric_attribute: { key: atlas.steps, min_value: 5, max_value: 100 }
      - name: escalated
        type: boolean_attribute
        boolean_attribute: { key: atlas.escalated, value: true }
      - name: baseline
        type: probabilistic
        probabilistic: { sampling_percentage: 20 }

  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  # Langfuse accepts OTLP/HTTP with basic auth (base64 of "public_key:secret_key").
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_BASE_URL}/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_BASIC_AUTH}"
    timeout: 5s
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
    sending_queue:
      enabled: true
      queue_size: 2000

  # Arize Phoenix (Sections 12.3 and 13.2): the `phoenix` service in
  # docker-compose.observability.yml. otlphttp appends /v1/traces to the endpoint.
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    timeout: 5s

  # Collector's own view of the spans for debugging (`docker compose logs otel-collector`).
  debug:
    verbosity: basic

  # Span-derived metrics are exposed to Prometheus alongside the app's /metrics.
  prometheus:
    endpoint: 0.0.0.0:8889

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 4s, 8s, 16s]
    dimensions:
      - name: gen_ai.request.model
      - name: atlas.tenant
      - name: gen_ai.operation.name

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, tail_sampling, batch]
      exporters: [otlphttp/langfuse, otlphttp/phoenix, debug, spanmetrics]
    metrics:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
