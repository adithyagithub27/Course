# Prometheus scrape config for the Atlas stack (Section 9.2).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: atlas
    metrics_path: /metrics
    static_configs:
      - targets: ["atlas:8000"]
        labels: { service: atlas }
      # local dev outside docker:
      # - targets: ["host.docker.internal:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
