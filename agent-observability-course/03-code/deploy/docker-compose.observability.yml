# OpenTelemetry Collector + Prometheus + Grafana (+ Atlas itself) — Sections 9 and 13.
#
#   docker compose -f deploy/docker-compose.observability.yml up -d --build
#   Atlas       http://localhost:8000/healthz   (OTEL_EXPORTER=otlp -> collector)
#   Prometheus  http://localhost:9091
#   Grafana     http://localhost:3001  (admin / admin; dashboard "Atlas Ops" is provisioned)
#   Collector   OTLP http :4318, grpc :4317, self-metrics :8888
#   Phoenix     http://localhost:6006   (second trace backend; the collector fans out to it)
#
# Optional: set LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_BASE_URL in .env and
# the collector forwards traces to Langfuse as a second backend (see otel-collector.yaml).
services:
  atlas:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      OFFLINE: ${OFFLINE:-1}
      OTEL_EXPORTER: otlp
      # Langfuse keys from ../.env are blanked here on purpose: in the stack the collector is
      # the only exporter to Langfuse (otel-collector.yaml). Leaving them set would make the
      # app export the same spans directly as well, so every trace would appear twice.
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      DEPLOYMENT_ENVIRONMENT: compose
    depends_on:
      - otel-collector

  phoenix:
    image: arizephoenix/phoenix:version-20.18.0   # verify the current tag before recording
    ports:
      - "6006:6006"   # UI and OTLP/HTTP (/v1/traces); its gRPC 4317 stays inside the network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_BASIC_AUTH: ${LANGFUSE_BASIC_AUTH:-}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - phoenix

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=45d   # > the 30-day SLO window (Lecture 9.3)
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  prom_data:
  grafana_data:
