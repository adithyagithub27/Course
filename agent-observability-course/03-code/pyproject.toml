[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-observability-course"
version = "1.0.0"
description = "Atlas: an observable IT/HR helpdesk agent for the course 'AI Agent Observability & Cost Control: LLMOps in Production'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langfuse~=4.15",
  "opentelemetry-sdk~=1.45",
  "opentelemetry-exporter-otlp-proto-http~=1.45",
  "opentelemetry-semantic-conventions>=0.66b0",
  "openinference-instrumentation-openai~=0.1.61",
  "litellm~=1.103",
  "openai~=2.54",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "deepeval~=4.2"]
langsmith = ["langsmith~=0.14"]
phoenix = ["arize-phoenix>=8"]
dashboards = ["streamlit>=1.35", "pandas>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/northwind", "app", "telemetry", "simulator", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "live: needs real API keys and network (skipped by default)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["deploy", "incidents/*/spans.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["northwind", "app", "telemetry", "simulator", "evals", "console"]
